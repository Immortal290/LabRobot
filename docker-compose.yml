services:
  db:
    image: postgres:15
    container_name: labrobot_db
    environment:
      POSTGRES_USER: robot_user
      POSTGRES_PASSWORD: robot_password
      POSTGRES_DB: labrobot
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: labrobot_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    command: sh -c "echo 'listener 1883\nallow_anonymous true' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labrobot_backend
    environment:
      - DATABASE_URL=postgresql://robot_user:robot_password@db:5432/labrobot
      - SECRET_KEY=your_super_secret_key_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # ── Gmail API — paste values from Google Cloud Console + OAuth Playground ─
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - GMAIL_SENDER_ADDRESS=${GMAIL_SENDER_ADDRESS:-}
      - GMAIL_SENDER_NAME=${GMAIL_SENDER_NAME:-Lab Buddy}
    ports:
      - "8000:8000"
    volumes:
      - tunnel_logs:/logs
    depends_on:
      - mosquitto
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labrobot_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  hardware:
    build:
      context: ./hardware
      dockerfile: Dockerfile
    container_name: labrobot_hardware
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  ros_bridge:
    build:
      context: ./ros2_ws
      dockerfile: Dockerfile
    container_name: labrobot_ros_bridge
    environment:
      - BACKEND_URL=ws://backend:8000/ws/bridge
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: labrobot_tunnel
    user: root
    command: tunnel --url http://frontend:80 --no-autoupdate --logfile /logs/cloudflared.log
    depends_on:
      - frontend
    volumes:
      - tunnel_logs:/logs
    restart: unless-stopped

volumes:
  postgres_data:
  tunnel_logs:
  mosquitto_data:
  mosquitto_log:
