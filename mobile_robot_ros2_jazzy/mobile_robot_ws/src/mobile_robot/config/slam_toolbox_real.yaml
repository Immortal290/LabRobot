# ═══════════════════════════════════════════════════════════════════════════
#  slam_toolbox_real.yaml  —  SLAM Toolbox for REAL hardware
#  Sensor: YDLIDAR X2  |  Odometry: EKF-fused wheel encoder
#  ROS 2 Jazzy | AURA Mobile Robot
#
#  TWO-PHASE WORKFLOW:
#  ─────────────────
#  PHASE 1 — MAPPING (this file)
#    ros2 launch mobile_robot real_slam_mapping.launch.py
#    → Drive the robot around the lab with teleop
#    → Map auto-saves every 5 s to maps/lab_map.*
#    → When done, call: ros2 service call /slam_toolbox/save_map \
#        slam_toolbox/srv/SaveMap "{name: {data: '/path/to/maps/lab_map'}}"
#
#  PHASE 2 — NAVIGATION (switch to localization mode)
#    ros2 launch mobile_robot real_robot_nav.launch.py \
#        use_slam:=false map_yaml:=/path/to/maps/lab_map.yaml
#
#  MANUAL MAP SAVE COMMANDS:
#    # Save as PNG + YAML (use in nav2 later):
#    ros2 service call /slam_toolbox/save_map \
#      slam_toolbox/srv/SaveMap "{name: {data: 'lab_map'}}"
#
#    # Serialize full pose graph (allows resuming mapping):
#    ros2 service call /slam_toolbox/serialize_map \
#      slam_toolbox/srv/SerializePoseGraph \
#      "{filename: {data: '/home/lab/Desktop/AURA/mobile_robot_ros2_jazzy/mobile_robot_ws/src/mobile_robot/maps/lab_map'}}"
# ═══════════════════════════════════════════════════════════════════════════

slam_toolbox:
  ros__parameters:

    # ── SLAM mode ─────────────────────────────────────────────────────────
    mode: mapping           # 'mapping' builds the map | 'localization' uses saved map

    # Real hardware — NOT simulation time
    use_sim_time: false
    debug_logging: false    # set true only when diagnosing issues

    # ── TF frame names — must match URDF and EKF config ───────────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_footprint

    # ── Sensor input ──────────────────────────────────────────────────────
    # SLAM Toolbox reads /scan and uses the TF odom→base_footprint
    # provided by the EKF (ekf_filter_node) to localize scans.
    scan_topic:     /scan
    throttle_scans: 1       # process every incoming scan (no skipping)

    # ── TF / timing ───────────────────────────────────────────────────────
    tf_buffer_duration:  30.0   # seconds of TF history to keep
    transform_timeout:    0.5   # max wait for a TF lookup (s)

    # ── Map update & AUTO-SAVE ────────────────────────────────────────────
    # Every map_update_interval seconds the occupancy grid (/map topic) is
    # recomputed from the pose graph → RViz updates in real-time.
    # The pose graph is also serialized to map_file_name.posegraph + .data
    # so the session survives a crash.
    map_update_interval: 3.0    # seconds — low enough for smooth real-time RViz updates

    # Auto-save destination outside the source tree so colcon never deletes it.
    # Toolbox appends .posegraph / .data automatically.
    # Call save_map service when done to write the final .pgm + .yaml for Nav2.
    # NOTE: Leave this empty to always start a fresh map.
    # Set to a path (without extension) only if you have existing .posegraph/.data
    # files you want to RESUME from. The .pgm/.yaml from nav2_map_saver are NOT
    # the same format — SLAM toolbox needs its own serialised format.
    map_file_name: ''

    # Robot starts mapping from its current position as the origin (0, 0, 0).
    map_start_at_dock: false
    map_start_pose: [0.0, 0.0, 0.0]

    # ── Map resolution ────────────────────────────────────────────────────
    resolution:       0.05    # 5 cm per cell — good balance of detail vs memory
    max_laser_range: 10.0     # YDLIDAR X2 effective range (m) — conservative

    # ── Minimum travel before adding a new scan ───────────────────────────
    # Scans are only added when the robot has moved enough to add new info.
    minimum_travel_distance: 0.10  # metres — tight spaces need dense scans
    minimum_travel_heading:  0.10  # radians (~5.7°)

    # ── Scan matching — ICP-like refinement ───────────────────────────────
    # Scan matching corrects odometry drift before inserting a new scan node.
    use_scan_matching:              true
    use_scan_bagging:               false
    minimum_score_for_scan_matching: 0.5   # 0.5 suits plain lab walls well

    correlation_search_space_dimension:        0.5
    correlation_search_space_resolution:       0.01
    correlation_search_space_smear_deviation:  0.1
    correlation_search_max_linear_search_window:  0.8
    correlation_search_max_angular_search_window: 1.57

    # ── Loop closure ──────────────────────────────────────────────────────
    # When the robot returns to a previously mapped area, loop closure
    # snaps the pose graph together → eliminates accumulated drift.
    do_loop_closing:                     true
    loop_search_max_linear_distance:     5.0   # metres
    loop_search_max_angular_distance:    0.524  # 30°
    loop_match_minimum_chain_size:       10
    loop_match_maximum_variance_coarse:  3.0
    loop_match_minimum_response_coarse:  0.35
    loop_match_minimum_response_fine:    0.45

    # ── Visualization ─────────────────────────────────────────────────────
    publish_pose_graph: true   # publishes MarkerArray of pose graph nodes/edges
