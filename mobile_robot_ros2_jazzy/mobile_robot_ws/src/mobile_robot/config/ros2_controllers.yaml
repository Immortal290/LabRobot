controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# ────────────────────────────────────────────────
#  Differential Drive Controller
# ────────────────────────────────────────────────
diff_drive_controller:
  ros__parameters:
    # Wheel joints — 4-wheel (left pair + right pair share velocity)
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint

    # Physical geometry (matches URDF)
    wheel_separation: 0.660     # distance between left/right wheel centerlines (m)
    wheel_radius:     0.075     # wheel radius (m)

    # Velocity limits
    linear:
      x:
        has_velocity_limits:     true
        max_velocity:            0.8   # m/s
        has_acceleration_limits: true
        max_acceleration:        0.5   # m/s²

    angular:
      z:
        has_velocity_limits:     true
        max_velocity:            1.5   # rad/s
        has_acceleration_limits: true
        max_acceleration:        1.0   # rad/s²

    # Topic remapping
    publish_rate: 50.0

    # Odometry
    pose_covariance_diagonal:     [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal:    [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop:                    false
    enable_odom_tf:               true
    odom_frame_id:                odom
    base_frame_id:                base_footprint
    cmd_vel_timeout:              0.5

# ────────────────────────────────────────────────
#  Joint State Broadcaster
# ────────────────────────────────────────────────
joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    extra_joints: []
